# Monthly check of every link in the built site, external ones included.
# Opens an issue listing broken links (brief 12.4).
name: Monthly link check

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Links to the site itself are checked offline on every pull request (ci.yml).
          args: >-
            --no-progress --include-fragments
            --root-dir "${{ github.workspace }}/dist/client"
            --exclude '^https://joylynnwanjiru\.com'
            --exclude '/api/'
            'dist/client/**/*.html'
          output: ./lychee/out.md
          fail: false

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found by the monthly check
          content-filepath: ./lychee/out.md
          labels: links
